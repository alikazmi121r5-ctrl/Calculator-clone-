<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <h1 id="h">My calculator</h1>
    </header>
    <body>
        <div class="cal-body">
            <div class="screen">
                <p id="screen-body"></p>
            </div>
            <div class="buttons-opt">
                <button id="clear" class="operate-but">C</button>
                <button id="modulus" class="operate-but">%</button>
                <button id="divide" class="operate-but">/</button>
                <button id="power" class="power-but">ON/OFF</button><br>
                <button id="but-1" class="num-but">1</button> 
                <button id="but-2" class="num-but">2</button> 
                <button id="but-3" class="num-but">3</button><button id="multiply" class="operate-but">*</button><br>
                <button id="but-4" class="num-but">4</button>
                <button id="but-5" class="num-but">5</button>
                <button id="but-6" class="num-but">6</button><button id="subtract" class="operate-but">-</button><br>
                <button id="but-7" class="num-but">7</button>
                <button id="but-8" class="num-but">8</button>
                <button id="but-9" class="num-but">9</button> <button id="addition" class="operate-but">+</button><br>
                <button id="but-0" class="num-but">0</button>
                <button id="dot" class="operate-but">.</button>
                <button id="equal" class="operate-but">=</button>
            </div>
        </div>
    </body>
    <script src="logic.js"></script>
</body>
</html>
